<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
  <!-- Simple original water drop icon -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3aa0ff"/>
      <stop offset="100%" stop-color="#0d6efd"/>
    </linearGradient>
    <linearGradient id="half" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <!-- Drop shape -->
  <path d="M16 2 C16 2 8 12 8 18 C8 24 12.477 29 16 29 C19.523 29 24 24 24 18 C24 12 16 2 16 2 Z" fill="url(#g)"/>
  <!-- Half highlight (upper-left glaze) -->
  <path d="M16 4 C16 4 10 12 10 18 C10 22.418 13.134 26 16 26 C18.866 26 22 22.418 22 18 C22 14 16 4 16 4 Z" fill="url(#half)"/>
  <!-- Inner highlight circle -->
  <circle cx="13" cy="14" r="3.2" fill="#fff" opacity="0.35"/>
</svg>
