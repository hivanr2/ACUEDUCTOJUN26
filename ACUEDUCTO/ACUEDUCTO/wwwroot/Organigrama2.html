<meta charset="UTF-8">

<style>
:root { --gap: 14px; }
* { box-sizing: border-box; }
body { margin: 0; }
.wrap { width: 100%; padding: 16px 0; }

.org-container { 
  position: relative; 
  width: 100%; 
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

svg.org {
  display: block;
  width: 100%;
  height: auto;
  min-width: 1060px;
}

.card {
  cursor: pointer;
  transition: opacity .15s;
}
.card:hover { opacity: .85; }

.panel-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.45);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.panel-overlay.open { display: flex; }

.panel {
  background: var(--color-background-primary, #FFFFFF);
  border: 0.5px solid var(--color-border-secondary);
  border-radius: 16px;
  padding: 28px 32px;
  max-width: 560px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  position: relative;
}

.panel h2 {
  margin: 0 0 6px;
  font-size: 18px;
  font-weight: 500;
  color: var(--color-text-primary);
}
.panel .subtitle {
  font-size: 13px;
  color: var(--color-text-secondary);
  margin: 0 0 20px;
}
.panel .func-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.panel .func-list li {
  font-size: 16px;
  color: var(--color-text-primary);
  line-height: 1.6;
  padding: 10px 12px;
  border-bottom: 0.5px solid var(--color-border-tertiary);
  background: #F5F8FF;
  border-radius: 10px;
  margin-bottom: 8px;
  display: flex;
  gap: 10px;
}
.panel .func-list li:last-child { border-bottom: none; margin-bottom: 0; }
.panel .func-text {
  font-size: 16px;
  font-weight: 500;
}
.func-num {
  min-width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 500;
  flex-shrink: 0;
  margin-top: 1px;
}
.close-btn {
  position: absolute;
  top: 16px; right: 16px;
  background: none;
  border: 0.5px solid var(--color-border-secondary);
  border-radius: 8px;
  width: 28px; height: 28px;
  cursor: pointer;
  font-size: 16px;
  color: var(--color-text-secondary);
  display: flex; align-items: center; justify-content: center;
  line-height: 1;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  padding: 12px 0 4px;
  font-size: 12px;
  color: var(--color-text-secondary);
  align-items: center;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 12px; height: 12px; border-radius: 3px; }

.mobile-hint {
  display: none;
  font-size: 12px;
  color: var(--color-text-secondary);
  padding: 0 10px 8px;
}

@media (max-width: 768px) {
  .wrap { padding: 10px 0; }
  .legend { gap: 10px; padding: 10px 10px 6px; font-size: 11px; }
  .legend > span { font-size: 12px !important; }
  .org-container { padding: 0 8px 8px; }
  .mobile-hint { display: block; }
  .panel-overlay { padding: 12px; }
  .panel { padding: 20px 16px; border-radius: 12px; max-height: 85vh; }
  .panel h2 { font-size: 16px; padding-right: 30px; }
  .panel .subtitle { font-size: 12px; margin-bottom: 14px; }
  .panel .func-list li, .panel .func-text { font-size: 14px; line-height: 1.45; }
}
</style>
</head>

function showCard(id) {
  const d = DATA[id];
  if (!d) return;
  document.getElementById('panel-title').textContent = d.title;
  document.getElementById('panel-sub').textContent = d.sub;
  const ul = document.getElementById('panel-funcs');
  ul.innerHTML = '';
  d.funcs.forEach(function(f, i) {
    const li = document.createElement('li');
    li.innerHTML = '<span class="func-num" style="background:' + d.bg + ';color:' + d.color + '">' + (i+1) + '</span><span class="func-text">' + f + '</span>';
    ul.appendChild(li);
  });
  document.getElementById('overlay').classList.add('open');
}

function closeAll() {
  document.getElementById('overlay').classList.remove('open');
}

document.addEventListener('DOMContentLoaded', function() {
  const overlay = document.getElementById('overlay');
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeAll();
    });
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeAll();
  });

  const cards = document.querySelectorAll('.card');
  cards.forEach(function(card) {
    card.addEventListener('click', function(e) {
      e.stopPropagation();
      const cardId = card.getAttribute('data-card-id');
      if (cardId) {
        showCard(cardId);
      }
    });
  });
});
</script>
